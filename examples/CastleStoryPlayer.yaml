# Example configuration for the ARCHILAN CASTLE STORY APWorld.
# Map IDs MUST be the actual non-localized asset/folder ID detected in your game.
# DO NOT use translated names from the Castle Story user interface.
#
# Run tools/inspect_maps.py on the installed game, then confirm game mode
# support and the number of capturable shards per map.
name: CastleStoryPlayer
game: Castle Story
Castle Story:
  game_mode: hybrid
  invasion_goal: 5
  conquest_shards: 8
  invasion_map_pool: []
  conquest_map_capacities: {}
